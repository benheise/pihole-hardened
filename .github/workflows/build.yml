name: build

# Reusable workflow, called only by release.yml. Signing and provenance happen
# here, so verifiers can pin the signer to this exact workflow file
# (gh attestation verify --signer-workflow .../build.yml). That isolation is
# what lets GitHub artifact attestations meet SLSA Build Level 3.
on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, e.g. ghcr.io/owner/repo
        type: string
        required: true
      docker_tag:
        description: Upstream docker-pi-hole release tag whose startup scripts are used
        type: string
        required: true
      build_args:
        description: Newline-separated KEY=value build arguments
        type: string
        required: true
      source_date_epoch:
        description: Commit time, for reproducible timestamps
        type: string
        required: true
      build_tag:
        description: Tag for the unpublished multi-platform image, e.g. build-42
        type: string
        required: true
    outputs:
      digest:
        description: Digest of the signed multi-platform image index
        value: ${{ jobs.merge.outputs.digest }}

permissions: {}

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, key: linux-amd64, runner: ubuntu-24.04, qemu: false }
          - { platform: linux/arm64, key: linux-arm64, runner: ubuntu-24.04-arm, qemu: false }
          # 32-bit Raspberry Pi OS. Emulated: GitHub has no native 32-bit Arm runners.
          - { platform: linux/arm/v7, key: linux-arm-v7, runner: ubuntu-24.04, qemu: true }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checkout
      packages: write # push the platform image by digest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out upstream docker-pi-hole at the pinned tag
        id: upstream
        env:
          DOCKER_TAG: ${{ inputs.docker_tag }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$DOCKER_TAG" \
            https://github.com/pi-hole/docker-pi-hole.git upstream
          # Recorded in the image's build-inputs.txt, so a later rebuild can
          # tell whether the tag still points at the same startup scripts
          echo "commit=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - if: matrix.qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ inputs.build_args }}
            PIHOLE_DOCKER_COMMIT=${{ steps.upstream.outputs.commit }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true

      - name: Record the platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.key }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge, sign, attest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required by the provenance action
      packages: write # push the index, provenance and signature
      id-token: write # keyless signing (Sigstore) and provenance
      attestations: write # store provenance in GitHub
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-platform index
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.build_tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          [ "${#refs[@]}" -eq 3 ] || { echo "::error::expected 3 platform digests, got ${#refs[@]}"; exit 1; }
          # GHCR links the package to this repository through the source annotation
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.description=Hardened rebuild of the official Pi-hole image" \
            --annotation "index:org.opencontainers.image.licenses=EUPL-1.2" \
            "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Index: \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the index (keyless)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
