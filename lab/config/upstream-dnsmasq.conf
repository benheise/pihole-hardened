# Authoritative test zone for the lab. Pi-hole forwards here; nothing leaves
# the lab network.
no-resolv
no-hosts
log-queries
log-facility=-
local=/lab.example/
local-ttl=300

host-record=allowed.lab.example,10.10.0.1,fd00::1
host-record=ads.lab.example,10.10.0.66
host-record=tracker1.lab.example,10.10.0.71
host-record=tracker2.lab.example,10.10.0.72
host-record=denyme.lab.example,10.10.0.80
host-record=allowme.lab.example,10.10.0.81
host-record=plain-list.lab.example,10.10.0.90
host-record=hosts-list.lab.example,10.10.0.91
host-record=abp-parent.lab.example,10.10.0.92
host-record=deep.abp-parent.lab.example,10.10.0.93
host-record=exact-only.lab.example,10.10.0.94
host-record=child.exact-only.lab.example,10.10.0.95
host-record=antigravity.lab.example,10.10.0.96
host-record=mail.lab.example,10.10.0.25
cname=cname-to-ad.lab.example,ads.lab.example
txt-record=txt.lab.example,"lab-txt-ok"
mx-host=lab.example,mail.lab.example,10

# List server, plus the names gravity checks before downloading
host-record=lists.lab.example,172.30.0.11
host-record=github.com,172.30.0.11
host-record=raw.githubusercontent.com,172.30.0.11

# RFC 6761 probe: the upstream can answer this, but Pi-hole must never
# forward .test names (it adds server=/test/), so clients get NXDOMAIN.
host-record=probe.special.test,10.10.0.99
