# Production deployment for a Raspberry Pi (DNS only, bridge networking).
# Tested settings: every option here is exercised by scripts/smoke-test.sh.
#
# Before first start:
#   - set PIHOLE_IMAGE in .env to a verified digest (deploy/update.sh does this)
#   - write the admin password to ./webpassword (one line, chmod 600). It is
#     mounted as a Docker secret and read by start.sh, so it never appears in
#     "docker inspect" or the compose environment
#   - free port 53 on the host: set DNSStubListener=no in
#     /etc/systemd/resolved.conf and restart systemd-resolved
services:
  pihole:
    image: ${PIHOLE_IMAGE:?set PIHOLE_IMAGE to ghcr.io/benheise/pihole-hardened@sha256:...}
    container_name: pihole
    restart: unless-stopped
    ports:
      # Published ports bypass host firewalls such as ufw. To serve one
      # interface only, prefix the LAN address: "192.168.1.2:53:53/udp".
      - "53:53/tcp"
      - "53:53/udp"
      - "127.0.0.1:8443:443/tcp"   # admin UI on localhost only; publish to the LAN deliberately
    environment:
      TZ: America/New_York
      FTLCONF_dns_listeningMode: ALL   # required on bridge networks: queries arrive from the bridge IP
      FTLCONF_database_maxDBdays: "30"
      # Admin password from the secret below (upstream start.sh reads /run/secrets/<name>)
      WEBPASSWORD_FILE: webpassword
      # FTL's built-in NTP server and client are off: the client cannot set the
      # clock without CAP_SYS_TIME (the host keeps time), and the server would
      # be one more unauthenticated listener on the LAN. To run the NTP server,
      # set ntp_ipv4_active to "true" and publish 123/udp.
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"
      # Defense in depth for the web root: the image already removes repository
      # metadata, and this makes CivetWeb answer 404 for any dot-file or
      # dot-directory, which FTL would otherwise serve before login.
      FTLCONF_webserver_advancedOpts: "hide_files_patterns=**/.*"
      # Run FTL under a dedicated UID/GID. The default (1000) is usually the
      # Pi's main login user, who would then own ./etc-pihole, including the
      # query history and the admin password hash.
      PIHOLE_UID: "1999"
      PIHOLE_GID: "1999"
    secrets:
      - webpassword
    volumes:
      - ./etc-pihole:/etc/pihole

    # Upstream's start.sh runs as root, sets file capabilities on pihole-FTL and
    # starts FTL as the "pihole" user. Docker grants 14 capabilities by default;
    # this keeps the 7 the image needs (each one was tested by removing it):
    #   CHOWN, FOWNER     fix ownership/permissions of /etc/pihole and logs
    #   DAC_OVERRIDE      root must rename pihole-owned logs during rotation;
    #                     without it rotation fails silently and logs grow forever
    #   SETUID, SETGID    drop to the pihole user (capsh, sudo, su)
    #   SETFCAP           start.sh applies setcap on every start; without it the
    #                     container exits ("Unable to set capabilities")
    #   KILL              stop FTL cleanly; without it shutdown waits 30s and
    #                     FTL is SIGKILLed before flushing its database
    # FTL itself ends up with no capabilities at all: no-new-privileges stops
    # the file capabilities start.sh sets from taking effect, and FTL needs
    # none of them for DNS on a bridge network.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETFCAP, KILL]
    # Safe on bridge networking: Docker sets net.ipv4.ip_unprivileged_port_start=0
    # in the container, so FTL binds port 53 with no capabilities at all.
    security_opt:
      - no-new-privileges:true
    # Must stay false: start.sh writes a capability xattr onto /usr/bin/pihole-FTL
    # at every start, which fails on a read-only root filesystem.
    read_only: false
    tmpfs:
      - /tmp:size=64m
    pids_limit: 256
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

secrets:
  webpassword:
    file: ./webpassword

# DHCP variant (lab-tested: lab/LAB-PLAN.md V04, V07-V09; physical-LAN reach not tested):
#   network_mode: host            # DHCP needs broadcast on the LAN; remove "ports:"
#   cap_add: add NET_BIND_SERVICE, NET_ADMIN and NET_RAW
#   security_opt: remove no-new-privileges. FTL runs as the pihole user and
#     gets its capabilities from file capabilities, which no-new-privileges
#     blocks. With it, dnsmasq refuses DHCP ("missing required capability
#     NET_ADMIN") and, on host networking, FTL cannot bind port 53 (the host's
#     unprivileged-port floor is 1024).
#   environment: FTLCONF_dhcp_active: "true" plus your dhcp.* settings
#   WARNING (upstream behavior, both images): if DHCP is enabled but NET_ADMIN
#   is missing, FTL stops on a config error and DNS goes down too. start.sh's
#   "DHCP will not be started" fallback can't turn DHCP off when it was enabled
#   through an FTLCONF_ variable, because that makes the setting read-only.
